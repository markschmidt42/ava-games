<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hog Wild — pig viewer</title>
<style>
  :root {
    --felt-1:#2f6b52; --felt-2:#245240;
    --bg-1:#14231c; --bg-2:#0d1712;
    --panel:#1e3a2e; --panel-2:#27473a;
    --ink:#f4fbf7; --ink-dim:#a9c9b8;
    --gold:#ffd54a; --pink:#f291ac;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 90% at 50% 8%, var(--bg-1), var(--bg-2) 70%);
    color: var(--ink);
    font: 500 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud {
    position: fixed; left: 14px; top: 14px; z-index: 3;
    background: color-mix(in srgb, var(--panel) 82%, transparent);
    border: 1px solid var(--panel-2);
    border-radius: 16px; padding: 12px 14px;
    box-shadow: 0 12px 30px rgba(0,0,0,.42);
    backdrop-filter: blur(9px);
    max-width: min(64vw, 320px);
  }
  .hud h1 { margin: 0 0 6px; font-size: 15px; font-weight: 800; letter-spacing: .2px; }
  .hud .meta { color: var(--ink-dim); font-size: 12px; margin-bottom: 9px; }
  .hud .meta b { color: var(--gold); font-weight: 800; }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; }
  .keys kbd {
    font: 700 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--panel-2); border: 1px solid rgba(255,255,255,.14);
    border-radius: 6px; padding: 0 6px; color: var(--ink);
  }
  .keys span { color: var(--ink-dim); }
  .keys .on { color: var(--pink); font-weight: 700; }
  #pose {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 18px; z-index: 3;
    font-weight: 800; letter-spacing: .5px; font-size: 13px;
    background: color-mix(in srgb, var(--panel) 82%, transparent);
    border: 1px solid var(--panel-2); border-radius: 999px; padding: 8px 18px;
    box-shadow: 0 10px 26px rgba(0,0,0,.4);
  }
  #pose b { color: var(--gold); }
  #err {
    position: fixed; inset: auto 16px 16px 16px; z-index: 9;
    background: #3a1420; border: 1px solid #ff5c7a; border-radius: 12px;
    padding: 12px; font: 500 12px/1.5 ui-monospace, Menlo, monospace;
    white-space: pre-wrap; display: none;
  }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>

<div class="hud">
  <h1>Hog Wild · pig viewer</h1>
  <div class="meta" id="meta">loading…</div>
  <div class="keys" id="keys"></div>
</div>
<div id="pose">pose <b id="poseName">turntable</b></div>
<pre id="err"></pre>

<script type="importmap">
{
  "imports": {
    "three": "../vendor/three.module.js",
    "cannon-es": "../vendor/cannon-es.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import {
  buildScene, buildBoard, buildPig, pigTriangles, buildContactShadow,
  setExpression, EXPRESSIONS,
} from '../pig.js';
import { BOARD, POSE_KEYS, posePlacement, restHeight, poseQuaternion } from '../physics.js';

const errEl = document.getElementById('err');
window.addEventListener('error', (e) => {
  errEl.style.display = 'block';
  errEl.textContent += `${e.message}\n`;
});

const canvas = document.getElementById('c');
const view = buildScene(canvas);
view.scene.add(buildBoard());

const pigs = [buildPig(), buildPig()];
view.scene.add(...pigs);

// dev handles: this page exists to be poked at from a console / automation
window.__hw = { THREE, view, pigs };

const shadows = pigs.map(() => {
  const s = buildContactShadow(0.55);
  view.scene.add(s);
  return s;
});

/* --- framing ------------------------------------------------------------- */
const PEN_BOX = view.boardBox;
const CLOSE_BOX = new THREE.Box3(
  new THREE.Vector3(-1.9, -0.02, -1.15),
  new THREE.Vector3(1.9, 0.9, 1.15),
);
/* Faces only: both heads, at the size a reviewer needs to judge an eyebrow. */
const FACE_BOX = new THREE.Box3(
  new THREE.Vector3(-1.18, 0.10, -0.36),
  new THREE.Vector3(1.18, 0.74, 0.36),
);
/* What the game camera actually gives you: a pig about 150 px tall. */
const GAME_BOX = new THREE.Box3(
  new THREE.Vector3(-3.45, -0.05, -2.55),
  new THREE.Vector3(3.45, 1.65, 3.35),
);
const ZOOMS = ['pigs', 'pen', 'faces', 'game'];
const ZOOM_BOX = { pigs: CLOSE_BOX, pen: PEN_BOX, faces: FACE_BOX, game: GAME_BOX };
let zoom = 'pigs';
let pitch = 46;
function applyFraming() {
  const p = zoom === 'faces' ? Math.min(pitch, 24) : zoom === 'game' ? 52 : pitch;
  view.frame(ZOOM_BOX[zoom], { pitchDeg: p });
}
applyFraming();

/* --- state --------------------------------------------------------------- */
let pose = null;              // null = free turntable
let spin = true;
let orbit = false;
let expr = 'neutral';
const LANE = 0.62;            // half the gap between the two pigs
const t0 = performance.now();

/* q w e r t y u i, in EXPRESSIONS order */
const EXPR_KEYS = ['q', 'w', 'e', 'r', 't', 'y', 'u', 'i'];

const keysEl = document.getElementById('keys');
function row(k, label) {
  keysEl.insertAdjacentHTML('beforeend', `<kbd>${k}</kbd><span data-k="${k}">${label}</span>`);
}
POSE_KEYS.forEach((p, i) => row(String(i + 1), p));
row('0', 'free turntable');
EXPRESSIONS.forEach((s, i) => row(EXPR_KEYS[i], s));
row('z', 'zoom: pigs / pen / faces / game');
row('space', 'pause spin');
row('o', 'orbit camera');
row('[ ]', 'camera pitch');

function markActive() {
  keysEl.querySelectorAll('span').forEach((s) => s.classList.remove('on'));
  const k = pose === null ? '0' : String(POSE_KEYS.indexOf(pose) + 1);
  for (const key of [k, EXPR_KEYS[EXPRESSIONS.indexOf(expr)]]) {
    const el = keysEl.querySelector(`span[data-k="${key}"]`);
    if (el) el.classList.add('on');
  }
  document.getElementById('poseName').textContent = `${pose || 'turntable'} · ${expr}`;
}

function setExpr(s) {
  expr = s;
  pigs.forEach((p) => setExpression(p, s));
}
setExpr('neutral');

addEventListener('keydown', (e) => {
  const n = Number(e.key);
  const ei = EXPR_KEYS.indexOf(e.key);
  if (e.key >= '1' && e.key <= '6') { pose = POSE_KEYS[n - 1]; }
  else if (e.key === '0') { pose = null; }
  else if (ei >= 0 && ei < EXPRESSIONS.length) { setExpr(EXPRESSIONS[ei]); }
  else if (e.key === 'z') { zoom = ZOOMS[(ZOOMS.indexOf(zoom) + 1) % ZOOMS.length]; applyFraming(); }
  else if (e.key === ' ') { spin = !spin; e.preventDefault(); }
  else if (e.key === 'o') { orbit = !orbit; if (!orbit) applyFraming(); }
  else if (e.key === '[') { pitch = Math.max(14, pitch - 4); applyFraming(); }
  else if (e.key === ']') { pitch = Math.min(80, pitch + 4); applyFraming(); }
  markActive();
});
markActive();

// dev handles, part 2: automation drives expressions/zoom without keystrokes
window.__hw.setExpr = setExpr;
window.__hw.setZoom = (z) => { zoom = z; applyFraming(); };
window.__hw.setPose = (p) => { pose = p; placePigs(performance.now()); markActive(); };
window.__hw.place = () => placePigs(performance.now());
window.__hw.setSpin = (s) => { spin = s; };
/** frame one pig's head, tight — the "is this actually charming?" check */
window.__hw.headCam = (i = 0, half = 0.20, pitchDeg = 14) => {
  zoom = 'faces';
  placePigs(performance.now());
  // Aim at the EYE, not the middle of the head. Since the owner's 2026-08-11
  // layout the eye sits HIGH on the head (pig.js FACE.eyeU 0.352 → build-frame
  // y 0.425, i.e. COM-frame y +0.066) and forward at z 0.326; centring on the
  // head centre frames mostly jaw.
  const c = new THREE.Vector3(0, 0.066, 0.322);
  pigs[i].localToWorld(c);
  view.frame(
    new THREE.Box3(
      new THREE.Vector3(c.x - half, c.y - half * 0.8, c.z - half),
      new THREE.Vector3(c.x + half, c.y + half * 0.8, c.z + half),
    ),
    { pitchDeg, target: c.clone() },
  );
};
/**
 * Render all eight expressions into one contact sheet and replace the page with
 * it. Judging the faces side by side in a single look is the only honest way to
 * tell whether they read — and it takes one screenshot instead of eight.
 * Defaults to a Sider rest seen from the game camera, which is the pose 65% of
 * tosses actually land in.
 */
window.__hw.contactSheet = ({
  pose: p = 'side-blank', half = 0.26, pitchDeg = 52, crop = 0.46, dy = 0.06,
} = {}) => {
  const gl = view.renderer.domElement;
  document.querySelector('.hud').style.display = 'none';
  document.getElementById('pose').style.display = 'none';
  spin = false;
  zoom = 'pigs';
  window.__hw.setPose(p);
  const t = new THREE.Vector3(-LANE, 0.10, -0.02);
  view.frame(
    new THREE.Box3(
      new THREE.Vector3(t.x - half, -0.02, t.z - half),
      new THREE.Vector3(t.x + half, 0.24, t.z + half),
    ),
    { pitchDeg, target: t },
  );
  const W = 360, H = 300;
  const cv = document.createElement('canvas');
  cv.width = W * 4; cv.height = H * 2;
  const c = cv.getContext('2d');
  c.fillStyle = '#0d1712';
  c.fillRect(0, 0, cv.width, cv.height);
  EXPRESSIONS.forEach((n, i) => {
    setExpr(n);
    view.render();
    const col = i % 4, row = (i / 4) | 0;
    const cw = gl.width * crop, ch = (cw * H) / W;
    c.drawImage(gl, (gl.width - cw) / 2, (gl.height - ch) / 2 + dy * gl.height,
                cw, ch, col * W, row * H, W, H);
    c.fillStyle = '#ffd54a';
    c.font = '700 20px system-ui';
    c.fillText(n, col * W + 12, row * H + 26);
  });
  document.body.innerHTML = '';
  document.body.style.cssText = 'background:#0d1712;margin:0';
  const img = new Image();
  img.src = cv.toDataURL();
  img.style.cssText = 'width:100%;display:block';
  document.body.appendChild(img);
  return 'ok';
};

document.getElementById('meta').innerHTML =
  `<b>${pigTriangles().toLocaleString()}</b> triangles / pig · board r${BOARD.greenR}/${BOARD.roughR}/${BOARD.stopR} ` +
  `· three r${THREE.REVISION}`;

/* --- loop ---------------------------------------------------------------- */
const camTarget = new THREE.Vector3(0, 0.24, -0.1);
let yaw = 0, last = performance.now();

/** Place the pigs for the current pose/zoom. Split out of the loop so headless
 *  automation can lay the scene out and render it without waiting for rAF —
 *  requestAnimationFrame does not tick while the browser pane is hidden. */
function placePigs(now) {
  pigs.forEach((pig, i) => {
    const x = i === 0 ? -LANE : LANE;
    // In face-cam the yaw is pinned so the pigs turn a cheek each — the left pig
    // shows the dot flank, the right pig the other one, snouts nose to nose. Both
    // eyes get judged at once, which is the whole point of the mode.
    const y = zoom === 'faces'
      ? (i === 0 ? Math.PI / 2 : -Math.PI / 2)
      : yaw + (i === 0 ? 0 : Math.PI * 0.55);
    if (pose) {
      const pl = posePlacement(pose, { yaw: y, at: [x, 0] });
      pig.position.set(pl.position[0], pl.position[1], pl.position[2]);
      pig.quaternion.set(pl.quaternion.x, pl.quaternion.y, pl.quaternion.z, pl.quaternion.w);
    } else {
      // free turntable: trotting attitude, lifted just clear of the felt so the
      // whole silhouette reads, with a lazy bob
      const q = poseQuaternion('trotter', y);
      const h = restHeight(q, 0.002);
      pig.position.set(x, h + 0.10 + Math.sin(now / 1400 + i * 2.1) * 0.022, 0);
      pig.quaternion.set(q.x, q.y, q.z, q.w);
    }
    const s = shadows[i];
    if (s) {
      s.position.set(pig.position.x, 0.004, pig.position.z);
      const lift = Math.max(0, pig.position.y - 0.30);
      s.material.opacity = 0.8 * Math.max(0.12, 1 - lift * 3.2);
      const k = 1 + lift * 0.7;
      s.scale.set(k, k, 1);
    }
  });
  view.scene.updateMatrixWorld(true);
}

function frameLoop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (spin) yaw += dt * 0.34;
  placePigs(now);

  if (orbit) {
    const r = view.camera.position.clone().sub(camTarget);
    const a = now / 6000;
    const rad = Math.hypot(r.x, r.z);
    view.camera.position.set(camTarget.x + Math.sin(a) * rad, view.camera.position.y, camTarget.z + Math.cos(a) * rad);
    view.camera.lookAt(camTarget);
  }

  view.render();
  requestAnimationFrame(frameLoop);
}
requestAnimationFrame(frameLoop);
</script>
<script src="../../_watch/devnav.js" defer></script>
</body>
</html>
